<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C10" />
      <stop offset="50%" stop-color="#0B0F14" />
      <stop offset="100%" stop-color="#05080C" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Subtle Matrix/Grid Texture -->
  <g opacity="0.04" stroke="#22D3EE" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Subtle Geometric Apex Lines / Graph Mesh in Background -->
  <g opacity="0.2">
    <!-- Graph Edges -->
    <line x1="640" y1="110" x2="460" y2="290" stroke="#0E7490" stroke-width="1.5" />
    <line x1="640" y1="110" x2="820" y2="290" stroke="#0E7490" stroke-width="1.5" />
    <line x1="460" y1="290" x2="320" y2="470" stroke="#0E7490" stroke-width="1.5" />
    <line x1="460" y1="290" x2="640" y2="470" stroke="#0E7490" stroke-width="1.5" />
    <line x1="820" y1="290" x2="640" y2="470" stroke="#0E7490" stroke-width="1.5" />
    <line x1="820" y1="290" x2="960" y2="470" stroke="#0E7490" stroke-width="1.5" />
    <line x1="320" y1="470" x2="960" y2="470" stroke="#0E7490" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Central APEX Geometric Summit / Evidence Node Icon -->
  <g transform="translate(0, -25)">
    <!-- Filled glow under summit -->
    <polygon points="640,110 500,270 780,270" fill="url(#glowGrad)" />

    <!-- Outer Triangle / Apex Peak -->
    <polygon points="640,105 480,285 800,285" fill="none" stroke="#22D3EE" stroke-width="2.5" filter="url(#glow)" />
    <polygon points="640,105 480,285 800,285" fill="none" stroke="#E0F2FE" stroke-width="1.5" />

    <!-- Inner Constellation / Graph Nodes -->
    <line x1="640" y1="105" x2="640" y2="230" stroke="#06B6D4" stroke-width="1.5" opacity="0.8" />
    <line x1="640" y1="230" x2="550" y2="250" stroke="#06B6D4" stroke-width="1.5" opacity="0.8" />
    <line x1="640" y1="230" x2="730" y2="250" stroke="#06B6D4" stroke-width="1.5" opacity="0.8" />

    <!-- Graph Vertices (Evidence Nodes) -->
    <circle cx="640" cy="105" r="5" fill="#22D3EE" filter="url(#subtleGlow)" />
    <circle cx="480" cy="285" r="4.5" fill="#22D3EE" />
    <circle cx="800" cy="285" r="4.5" fill="#22D3EE" />
    <circle cx="640" cy="230" r="4" fill="#38BDF8" />
    <circle cx="550" cy="250" r="3.5" fill="#38BDF8" />
    <circle cx="730" cy="250" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Title / Wordmark -->
  <text x="640" y="380" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="64" 
        font-weight="800" 
        letter-spacing="14" 
        fill="#F8FAFC" 
        text-anchor="middle">
    APEX
  </text>

  <!-- Accent Divider -->
  <rect x="560" y="405" width="160" height="2.5" rx="1.25" fill="url(#cyanGrad)" filter="url(#subtleGlow)" />

  <!-- Subtitle -->
  <text x="640" y="445" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        font-weight="400" 
        letter-spacing="2.5" 
        fill="#94A3B8" 
        text-anchor="middle">
    Evidence-First Recon &amp; Bug Bounty Automation
  </text>

  <!-- Version & Architecture Tagline -->
  <g transform="translate(640, 480)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="0" y="5" 
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
          font-size="12" 
          font-weight="500" 
          fill="#38BDF8" 
          text-anchor="middle">
      16 PHASES &bull; FAIL-CLOSED SCOPE &bull; v8.0.0
    </text>
  </g>

  <!-- Legal Notice (Bottom Right) -->
  <text x="1230" y="605" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12" 
        font-weight="500" 
        letter-spacing="0.5" 
        fill="#64748B" 
        text-anchor="end">
    AUTHORIZED USE ONLY
  </text>

  <!-- Release Tag (Bottom Left) -->
  <text x="50" y="605" 
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
        font-size="12" 
        font-weight="500" 
        fill="#475569" 
        text-anchor="start">
    APEX v8.0 &mdash; Scope Integrity
  </text>
</svg>
